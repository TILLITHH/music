<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Spotify NFC</title>

<style>

body{

background:#121212;

font-family:Arial;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

margin:0;

color:white;

}

.card{

text-align:center;

width:320px;

}

img{

width:100%;

border-radius:20px;

box-shadow:0 10px 30px rgba(0,0,0,.4);

}

.button{
    display:inline-block;
    margin-top:20px;
    padding:15px 25px;
    font-size:18px;
    border-radius:999px;
    background:#1DB954;
    color:white;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="card">

<img id="cover">

<h2 id="title"></h2>

<p>Abriendo Spotify...</p>

<a id="open" href="#" class="button">
    Abrir en Spotify
</a>

</div>

<script>

const albums={

sanctuary:{

title:"TXT - The Star Chapter: SANCTUARY",

cover:"covers/sanctuary.jpg",

spotify:"https://open.spotify.com/album/72JboNccBYyXR676YNfcYE",

uri:"spotify:album:72JboNccBYyXR676YNfcYE"

}

}

const params=new URLSearchParams(location.search);

const id=params.get("album");

const album=albums[id];

document.getElementById("title").textContent=album.title;

document.getElementById("cover").src=album.cover;

const openButton = document.getElementById("open");

// El botón intentará abrir la app
openButton.href = album.uri;

// Si el usuario mantiene pulsado o el navegador no soporta spotify:,
// también podrá abrir la versión web manualmente.
openButton.addEventListener("click", () => {
    setTimeout(() => {
        window.location.href = album.spotify;
    }, 1500);
});

</script>

</body>
</html>
