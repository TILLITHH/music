<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Spotify NFC</title>

<style>

body{
    background:#121212;
    font-family:Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
    color:white;
}

.card{
    text-align:center;
    width:320px;
}

img{
    width:100%;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.button{
    display:none;
    margin-top:20px;
    padding:15px 25px;
    font-size:18px;
    border-radius:999px;
    background:#1DB954;
    color:white;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="card">

<img id="cover">

<h2 id="title"></h2>

<p id="status">Abriendo Spotify...</p>

<a id="open" class="button">
    Abrir en Spotify
</a>

</div>

<script>

const albums = {

    sanctuary: {

        title: "TXT - The Star Chapter: SANCTUARY",

        cover: "covers/sanctuary.jpg",

        spotify: "https://open.spotify.com/album/72JboNccBYyXR676YNfcYE",

        uri: "spotify:album:72JboNccBYyXR676YNfcYE"

    }

};

// Obtener parámetro de la URL
const params = new URLSearchParams(window.location.search);
const id = params.get("album");
const album = albums[id];

// Validar que exista
if (!album) {

    document.getElementById("status").textContent = "Álbum no encontrado.";
    throw new Error("Álbum no encontrado.");

}

// Mostrar información
document.getElementById("title").textContent = album.title;
document.getElementById("cover").src = album.cover;

const openButton = document.getElementById("open");

// El botón abrirá Spotify Web
openButton.href = album.spotify;

// Intentar abrir Spotify automáticamente
setTimeout(() => {

    window.location.href = album.uri;

}, 300);

// Si después de 2 segundos seguimos aquí,
// mostramos el botón para abrir Spotify Web.
setTimeout(() => {

    document.getElementById("status").textContent =
        "Si Spotify no se abrió automáticamente, pulsa el botón.";

    openButton.style.display = "inline-block";

}, 2000);

</script>

</body>
</html>
