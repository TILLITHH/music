<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Spotify NFC</title>

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#121212;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

.card{
    width:320px;
    text-align:center;
}

img{
    width:100%;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.45);
}

#status{
    opacity:.8;
}

.button{
    display:none;
    margin-top:20px;
    padding:14px 24px;
    background:#1DB954;
    color:white;
    text-decoration:none;
    border-radius:999px;
    font-weight:bold;
}

.button:hover{
    filter:brightness(1.08);
}

</style>

</head>

<body>

<div class="card">

    <img id="cover">

    <h2 id="title"></h2>

    <p id="status">Abriendo Spotify...</p>

    <a id="open" class="button">
        Abrir en Spotify
    </a>

</div>

<script>

const albums = {

    sanctuary:{

        title:"TXT - The Star Chapter: SANCTUARY",

        cover:"covers/txt-sanctuary.jpg",

        spotify:"https://open.spotify.com/album/72JboNccBYyXR676YNfcYE",

        uri:"spotify:album:72JboNccBYyXR676YNfcYE"

    }

};

// -----------------------------------------

const params = new URLSearchParams(window.location.search);

const id = params.get("album");

const album = albums[id];

if(!album){

    document.body.innerHTML="<h2>Álbum no encontrado</h2>";

    throw new Error("Álbum no encontrado");

}

document.getElementById("title").textContent=album.title;

document.getElementById("cover").src=album.cover;

const status=document.getElementById("status");

const button=document.getElementById("open");

button.href=album.spotify;

let userClicked=false;

button.addEventListener("click",()=>{

    userClicked=true;

});

// Intentar abrir Spotify
setTimeout(()=>{

    location.href=album.uri;

},300);

// Mostrar botón
setTimeout(()=>{

    status.textContent="Si Spotify no se abrió automáticamente, pulsa el botón.";

    button.style.display="inline-block";

},2000);

// Abrir Spotify Web automáticamente
setTimeout(()=>{

    if(!userClicked){

        location.href=album.spotify;

    }

},5000);

</script>

</body>
</html>
