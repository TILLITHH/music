<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Spotify NFC</title>

<style>

body{

background:#121212;

font-family:Arial;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

margin:0;

color:white;

}

.card{

text-align:center;

width:320px;

}

img{

width:100%;

border-radius:20px;

box-shadow:0 10px 30px rgba(0,0,0,.4);

}

button{

margin-top:20px;

padding:15px 25px;

font-size:18px;

border:none;

border-radius:999px;

background:#1DB954;

color:white;

cursor:pointer;

}

</style>

</head>

<body>

<div class="card">

<img id="cover">

<h2 id="title"></h2>

<p>Abriendo Spotify...</p>

<button id="open">
Abrir Spotify
</button>

</div>

<script>

const albums={

sanctuary:{

title:"TXT - The Star Chapter: SANCTUARY",

cover:"covers/sanctuary.jpg",

spotify:"https://open.spotify.com/album/72JboNccBYyXR676YNfcYE",

uri:"spotify:album:72JboNccBYyXR676YNfcYE"

}

}

const params=new URLSearchParams(location.search);

const id=params.get("album");

const album=albums[id];

document.getElementById("title").textContent=album.title;

document.getElementById("cover").src=album.cover;

document.getElementById("open").onclick=()=>{

location.href=album.spotify;

}

location.href=album.uri;

setTimeout(()=>{

location.href=album.spotify;

},1500);

</script>

</body>
</html>
